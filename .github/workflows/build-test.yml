name: Build and test

on:
  workflow_dispatch:
  push:
    branches:
      - integration
      - main
  pull_request:
    branches:
      - integration
      - main
  schedule:
    - cron: '0 6 * * 1,3,5'

permissions:
  checks: write
  security-events: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp, javascript
      
      - name: Install dependencies
        run: |
          cd src
          dotnet restore

      - name: Build
        run: |
          cd src
          dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          cd src
          dotnet test --configuration Release --no-restore --verbosity normal --logger:trx --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: 'dotnet-version-${{ matrix.dotnet-version }}-analysis'  
      
      - name: Test Report
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        if: ${{ (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}    # run when check creation is permitted
        with:
          name: DotNet Tests          # Name of the check run which will be created
          path: |
            **/*.trx
          reporter: dotnet-trx        # Format of test results
      
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-coverage-report
          path: src/TestResults/**/coverage.cobertura.xml

